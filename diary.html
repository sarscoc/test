<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11141c">
<title>DIARY | Character Game</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--line:rgba(255,255,255,.24);--glass:rgba(15,18,27,.78);--text:#f4f5f8;--muted:rgba(244,245,248,.68)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10131b;color:var(--text);font-family:'Quicksand','Noto Sans JP',sans-serif}
body{background:radial-gradient(ellipse at 15% 0%,rgba(90,105,140,.24),transparent 42%),radial-gradient(ellipse at 100% 100%,rgba(84,66,115,.18),transparent 45%),#10131b}
.page{width:min(1180px,100%);min-height:100vh;margin:auto;padding:clamp(16px,3vw,38px);display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.28em;color:var(--muted);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:var(--text);text-decoration:none;font:600 13px 'Quicksand','Noto Sans JP',sans-serif;cursor:pointer;transition:background .18s,border-color .18s}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5)}
.heading{padding:14px 2px 8px}
.kicker{font-size:11px;letter-spacing:.32em;color:var(--muted);margin:0 0 8px}
h1{font-size:clamp(28px,5vw,46px);letter-spacing:.12em;font-weight:500;margin:0}
.subtitle{font-size:13px;color:var(--muted);margin:10px 0 0;letter-spacing:.04em}
.window{flex:1;min-height:68vh;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 55px rgba(0,0,0,.28);overflow:hidden;position:relative}
.windowbar{height:36px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:7px;padding:0 13px;background:rgba(255,255,255,.035)}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.38)}
.windowlabel{margin-left:6px;font-size:10px;letter-spacing:.2em;color:var(--muted)}
iframe{display:block;width:100%;height:calc(100vh - 210px);min-height:560px;border:0;background:#fff}
.note{font-size:11px;line-height:1.8;color:var(--muted);text-align:center;margin:0}
@media(max-width:600px){.page{padding:14px;gap:14px}.window{min-height:72vh}iframe{height:calc(100vh - 190px);min-height:520px}.btn{padding:8px 12px;font-size:12px}.subtitle{line-height:1.7}}
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="brand">CHARACTER GAME / ARCHIVE</div>
    <nav class="actions" aria-label="ページ操作">
      <a class="btn" href="./">← TOP</a>
      <a class="btn" href="https://sarsland.notion.site/710a55e32d9b46c88dc0cb054c550bb6?v=b39e8a6f4c62430ebce7d102c7c39c35&pvs=149" target="_blank" rel="noopener noreferrer">Notionで開く ↗</a>
    </nav>
  </header>
  <section class="heading">
    <p class="kicker">PERSONAL LOG</p>
    <h1>DIARY</h1>
    <p class="subtitle">記録を読む。世界の外へ出ずに、ここで。</p>
  </section>
  <section class="window" aria-label="日記">
    <div class="windowbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="windowlabel">DIARY DATABASE</span></div>
    <iframe
      src="https://sarsland.notion.site/ebd/710a55e32d9b46c88dc0cb054c550bb6?v=b39e8a6f4c62430ebce7d102c7c39c35"
      title="日記 - Notion"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </section>
  <p class="note">日記が表示されない場合は「Notionで開く」から閲覧してください。埋め込みにはNotion側で公開・埋め込み設定が必要です。</p>
</main>
</body>
</html>
