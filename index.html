<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: sans-serif;
}

#game {

    width: 900px;
    height: 506px;

    position: relative;

    overflow: hidden;

    background: white;

    border: 2px solid #999;

    cursor: pointer;
}

#character {

    position: absolute;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;
}

#message {

    position: absolute;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: white;

    border-radius: 24px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    z-index: 1000;
}

@keyframes pop {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }
}

#status {
    display: none;
}

</style>

</head>


<body>


<div id="game">

    <img id="character">

    <div id="message"></div>

    <div id="status"></div>

</div>


<script>


/* ==================================================
   基本
================================================== */

const game =
    document.getElementById("game");

const character =
    document.getElementById("character");

const message =
    document.getElementById("message");

const status =
    document.getElementById("status");


let data = null;


/*
   台詞の現在位置
*/

const count = {};


/*
   前回クリック時刻
*/

let lastClick = 0;


/*
   連打判定
*/

const RAPID_TIME = 400;


/*
   台詞表示タイマー
*/

let messageTimer = null;



/* ==================================================
   JSON読み込み
================================================== */

fetch("characters/143.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "143.json を読み込めませんでした。"
        );

    }

    return response.json();

})

.then(json => {

    data = json;

    loadCharacter();

    showGreeting();

})

.catch(error => {

    console.error(error);

});



/* ==================================================
   キャラクター表示
================================================== */

function loadCharacter() {

    const position =
        data.position || {};


    character.src =
        "images/" + data.image;


    character.style.left =
        (position.x || 0) + "px";


    character.style.top =
        (position.y || 0) + "px";


    character.style.width =
        (position.scale || 250) + "px";

}



/* ==================================================
   挨拶
================================================== */

function showGreeting() {

    if (
        !data.talk ||
        !Array.isArray(data.talk.greeting) ||
        data.talk.greeting.length === 0
    ) {

        return;

    }


    const talk =
        data.talk.greeting[0];


    showTalk(
        talk.text,
        game.clientWidth / 2,
        100
    );

}



/* ==================================================
   台詞表示
================================================== */

function showTalk(text, x, y) {

    if (!text) {
        return;
    }


    message.innerText =
        text;


    let messageX =
        x + 15;


    let messageY =
        y - 20;


    if (
        messageX + 420 >
        game.clientWidth
    ) {

        messageX =
            game.clientWidth - 440;

    }


    if (messageX < 10) {

        messageX = 10;

    }


    if (messageY < 20) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    message.style.animation =
        "none";


    void message.offsetWidth;


    message.style.animation =
        "pop 0.2s ease-out";


    if (messageTimer) {

        clearTimeout(messageTimer);

    }


    messageTimer =
        setTimeout(() => {

            message.style.display =
                "none";

        }, 2500);

}



/* ==================================================
   今日の日付
================================================== */

function getToday() {

    const now =
        new Date();


    return {

        month:
            now.getMonth() + 1,

        day:
            now.getDate()

    };

}



/* ==================================================
   日付 → MMDD
================================================== */

function dateNumber(value) {

    const parts =
        value.split("-");


    return (
        Number(parts[0]) * 100 +
        Number(parts[1])
    );

}



/* ==================================================
   期間判定
   年またぎ対応
================================================== */

function isInPeriod(start, end) {

    const today =
        getToday();


    const current =
        today.month * 100 +
        today.day;


    const startNumber =
        dateNumber(start);


    const endNumber =
        dateNumber(end);


    /*
       普通の期間
    */

    if (
        startNumber <= endNumber
    ) {

        return (
            current >= startNumber &&
            current <= endNumber
        );

    }


    /*
       年またぎ
    */

    return (
        current >= startNumber ||
        current <= endNumber
    );

}



/* ==================================================
   特別台詞を全部集める
================================================== */

function getSpecialTalks() {

    const talks = [];


    const today =
        getToday();



    /* ==========================================
       誕生日
    ========================================== */

    if (
        data.birthday &&
        data.birthday.month === today.month &&
        data.birthday.day === today.day &&
        Array.isArray(data.birthday.talk)
    ) {

        talks.push(
            ...data.birthday.talk
        );

    }



    /* ==========================================
       特定日
    ========================================== */

    if (
        data.special &&
        Array.isArray(data.special.dates)
    ) {

        data.special.dates.forEach(
            item => {

                if (
                    item.month === today.month &&
                    item.day === today.day &&
                    Array.isArray(item.talk)
                ) {

                    talks.push(
                        ...item.talk
                    );

                }

            }
        );

    }



    /* ==========================================
       期間
    ========================================== */

    if (
        data.special &&
        Array.isArray(data.special.periods)
    ) {

        data.special.periods.forEach(
            period => {

                if (
                    isInPeriod(
                        period.start,
                        period.end
                    )
                ) {

                    if (
                        Array.isArray(
                            period.talk
                        )
                    ) {

                        talks.push(
                            ...period.talk
                        );

                    }

                }

            }
        );

    }



    /* ==========================================
       月
    ========================================== */

    if (
        data.special &&
        data.special.months
    ) {

        const monthTalk =
            data.special.months[
                String(today.month)
            ];


        if (
            Array.isArray(monthTalk)
        ) {

            talks.push(
                ...monthTalk
            );

        }

    }


    return talks;

}



/* ==================================================
   通常＋特別台詞
================================================== */

function getNormalPool() {

    const pool = [];


    /*
       通常台詞
    */

    if (
        data.talk &&
        Array.isArray(
            data.talk.normal
        )
    ) {

        pool.push(
            ...data.talk.normal
        );

    }


    /*
       特別台詞を追加
    */

    pool.push(
        ...getSpecialTalks()
    );


    return pool;

}



/* ==================================================
   通常＋特別台詞を取得
================================================== */

function getNormalTalk() {

    const pool =
        getNormalPool();


    if (
        pool.length === 0
    ) {

        return null;

    }


    const key =
        "normal_pool";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        pool[
            index %
            pool.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   キャラ連打
================================================== */

function getRapidTalk() {

    if (
        !data.talk ||
        !Array.isArray(
            data.talk.rapid
        ) ||
        data.talk.rapid.length === 0
    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        data.talk.rapid[
            index %
            data.talk.rapid.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   エリア判定
================================================== */

function inside(x, y, area) {

    return (

        x >= area.x &&

        x <=
            area.x + area.width &&

        y >= area.y &&

        y <=
            area.y + area.height

    );

}



/* ==================================================
   エリア取得
================================================== */

function getArea(x, y) {

    if (
        !data ||
        !Array.isArray(data.areas)
    ) {

        return null;

    }


    for (
        let i = data.areas.length - 1;
        i >= 0;
        i--
    ) {

        const area =
            data.areas[i];


        if (
            inside(x, y, area)
        ) {

            return area;

        }

    }


    return null;

}



/* ==================================================
   エリア通常台詞
================================================== */

function getAreaTalk(area) {

    if (
        !area ||
        !Array.isArray(area.talk) ||
        area.talk.length === 0
    ) {

        return null;

    }


    const key =
        "area_" + area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.talk[
            index %
            area.talk.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   エリア連打
================================================== */

function getAreaRapidTalk(area) {

    if (
        !area ||
        !Array.isArray(area.rapid) ||
        area.rapid.length === 0
    ) {

        return null;

    }


    const key =
        "rapid_area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.rapid[
            index %
            area.rapid.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   クリック
================================================== */

game.addEventListener(
    "click",
    function(e) {


        if (!data) {
            return;
        }


        const rect =
            game.getBoundingClientRect();


        const x =
            e.clientX -
            rect.left;


        const y =
            e.clientY -
            rect.top;


        const now =
            Date.now();


        const rapid =
            now - lastClick <
            RAPID_TIME;


        lastClick =
            now;



        /* ==========================================
           エリア
        ========================================== */

        const area =
            getArea(x, y);


        if (area) {


            /*
               エリア連打
            */

            if (rapid) {

                const rapidTalk =
                    getAreaRapidTalk(
                        area
                    );


                if (rapidTalk) {

                    showTalk(
                        rapidTalk.text,
                        x,
                        y
                    );

                    return;

                }

            }


            /*
               エリア通常
            */

            const areaTalk =
                getAreaTalk(area);


            if (areaTalk) {

                showTalk(
                    areaTalk.text,
                    x,
                    y
                );

                return;

            }

        }



        /* ==========================================
           エリア外連打
        ========================================== */

        if (rapid) {

            const rapidTalk =
                getRapidTalk();


            if (rapidTalk) {

                showTalk(
                    rapidTalk.text,
                    x,
                    y
                );

                return;

            }

        }



        /* ==========================================
           通常＋特別
        ========================================== */

        const normalTalk =
            getNormalTalk();


        if (normalTalk) {

            showTalk(
                normalTalk.text,
                x,
                y
            );

        }

    }
);


</script>

</body>

</html>
