<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>


<style>

/* ========================================
   基本
======================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #eee;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: sans-serif;
}


/* ========================================
   ゲーム画面
======================================== */

#game {
    position: relative;

    width: 900px;
    height: 506px;

    overflow: hidden;

    background: #fff;

    cursor: pointer;

    user-select: none;
}


/* ========================================
   背景
======================================== */

#background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;

    pointer-events: none;
}


/* ========================================
   キャラクター
======================================== */

#character {
    position: absolute;

    z-index: 10;

    object-fit: contain;

    pointer-events: none;

    user-select: none;
}


/* ========================================
   枠
======================================== */

#frame {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    pointer-events: none;
}


/* ========================================
   台詞
======================================== */

#message {
    position: absolute;

    z-index: 100;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: #fff;

    border-radius: 22px;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    animation: pop 0.2s ease-out;
}


@keyframes pop {

    from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* ========================================
   メニューボタン
======================================== */

#openMenu {
    position: absolute;

    right: 12px;
    top: 12px;

    z-index: 200;

    border: none;

    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(255, 255, 255, 0.9);

    cursor: pointer;

    font-size: 18px;
}


/* ========================================
   誕生日アイコン
======================================== */

#birthdayIcon {
    position: absolute;

    left: 12px;
    top: 12px;

    z-index: 200;

    display: none;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.9);

    cursor: pointer;

    font-size: 20px;
}


/* ========================================
   メニュー
======================================== */

#menu {
    position: absolute;

    left: 0;
    top: 0;

    z-index: 500;

    display: none;

    width: 100%;
    height: 100%;

    overflow-y: auto;

    padding: 30px;

    background: rgba(255, 255, 255, 0.97);
}


#menu h1 {
    margin-top: 0;
}


.menu-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-bottom: 20px;
}


.menu-button {
    border: 1px solid #ccc;

    padding: 10px 16px;

    border-radius: 10px;

    background: #fff;

    cursor: pointer;

    font-size: 16px;
}


.menu-button:hover {
    background: #f4f4f4;
}


/* ========================================
   一覧
======================================== */

.list {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(120px, 1fr));

    gap: 12px;
}


/* ========================================
   カード
======================================== */

.card {
    overflow: hidden;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 12px;

    background: #fff;

    cursor: pointer;

    text-align: center;
}


.card:hover {
    background: #f5f5f5;
}


/* ========================================
   キャラクターサムネイル
======================================== */

.card-character-image {
    display: block;

    width: 80px;
    height: 80px;

    margin: 0 auto 8px;

    object-fit: cover;

    border-radius: 50%;
}


/* ========================================
   背景サムネイル
   元のJPEGをそのまま切り取って使用
======================================== */

.card-background-image {
    display: block;

    width: 100%;
    height: 80px;

    margin-bottom: 8px;

    object-fit: cover;

    object-position: center;

    border-radius: 8px;
}


/* ========================================
   カード文字
======================================== */

.card-name {
    font-size: 14px;
}


/* ========================================
   誕生日
======================================== */

#birthdayArea {
    margin-bottom: 25px;
}


.birthday-title {
    margin-bottom: 10px;

    font-size: 20px;
}


.birthday-empty {
    color: #888;
}


/* ========================================
   非表示
======================================== */

.hidden {
    display: none !important;
}

</style>

</head>


<body>


<div id="game">


    <!-- ================================
         背景
    ================================= -->

    <img
        id="background"
        alt=""
    >


    <!-- ================================
         キャラクター
    ================================= -->

    <img
        id="character"
        alt=""
    >


    <!-- ================================
         枠
    ================================= -->

    <img
        id="frame"
        alt=""
    >


    <!-- ================================
         台詞
    ================================= -->

    <div id="message"></div>


    <!-- ================================
         誕生日アイコン
    ================================= -->

    <button
        id="birthdayIcon"
        title="今日の誕生日"
    >
        🎂
    </button>


    <!-- ================================
         メニューボタン
    ================================= -->

    <button
        id="openMenu"
    >
        ☰
    </button>


    <!-- ================================
         メニュー
    ================================= -->

    <div id="menu">

        <h1>Character Game</h1>


        <div class="menu-buttons">

            <button
                class="menu-button"
                id="characterMenuButton"
            >
                👤 キャラクター選択
            </button>


            <button
                class="menu-button"
                id="backgroundMenuButton"
            >
                🖼 背景選択
            </button>


            <button
                class="menu-button"
                id="closeMenu"
            >
                ゲームに戻る
            </button>

        </div>


        <!-- ================================
             誕生日
        ================================= -->

        <section id="birthdayArea">

            <div class="birthday-title">
                🎂 今日の誕生日
            </div>

            <div
                id="birthdayList"
                class="list"
            ></div>

        </section>


        <!-- ================================
             キャラクター一覧
        ================================= -->

        <section
            id="characterSection"
            class="hidden"
        >

            <h2>
                キャラクター選択
            </h2>

            <div
                id="characterList"
                class="list"
            ></div>

        </section>


        <!-- ================================
             背景一覧
        ================================= -->

        <section
            id="backgroundSection"
            class="hidden"
        >

            <h2>
                背景選択
            </h2>

            <div
                id="backgroundList"
                class="list"
            ></div>

        </section>

    </div>

</div>



<script>

/* ==================================================
   DOM
================================================== */

const game =
    document.getElementById("game");

const background =
    document.getElementById("background");

const character =
    document.getElementById("character");

const frame =
    document.getElementById("frame");

const message =
    document.getElementById("message");

const menu =
    document.getElementById("menu");

const birthdayIcon =
    document.getElementById("birthdayIcon");

const birthdayArea =
    document.getElementById("birthdayArea");

const birthdayList =
    document.getElementById("birthdayList");

const characterList =
    document.getElementById("characterList");

const backgroundList =
    document.getElementById("backgroundList");

const characterSection =
    document.getElementById("characterSection");

const backgroundSection =
    document.getElementById("backgroundSection");


/* ==================================================
   状態
================================================== */

let characters = [];

let data = null;

let currentCostume = null;

let currentBackground = null;

let count = {};

let lastClick = 0;

const RAPID_TIME = 400;

let messageTimer = null;


/* ==================================================
   背景
   JSONは使わない。
   JPEGファイルだけ用意する。
================================================== */

const backgrounds = [

    {
        id: "spring",
        name: "春",
        image: "spring.jpg",
        season: "spring"
    },

    {
        id: "summer",
        name: "夏",
        image: "summer.jpg",
        season: "summer"
    },

    {
        id: "autumn",
        name: "秋",
        image: "autumn.jpg",
        season: "autumn"
    },

    {
        id: "winter",
        name: "冬",
        image: "winter.jpg",
        season: "winter"
    }

];


/* ==================================================
   起動
================================================== */

async function init() {

    try {

        await loadCharacters();

        setupBackground();

        setupBirthdayMenu();

        setupBackgroundMenu();

        await chooseInitialCharacter();

    }

    catch (error) {

        console.error(error);

        alert(
            "ゲームデータを読み込めませんでした。"
        );

    }

}


/* ==================================================
   キャラクター一覧読み込み
================================================== */

async function loadCharacters() {

    const response =
        await fetch(
            "characters/index.json"
        );


    if (!response.ok) {

        throw new Error(
            "characters/index.json が読み込めません。"
        );

    }


    const files =
        await response.json();


    characters = [];


    for (
        const file of files
    ) {

        try {

            const response =
                await fetch(
                    "characters/" +
                    file
                );


            if (!response.ok) {

                continue;

            }


            const json =
                await response.json();


            characters.push(
                json
            );

        }

        catch (error) {

            console.error(
                file,
                error
            );

        }

    }

}


/* ==================================================
   今日の日付
================================================== */

function getToday() {

    const now =
        new Date();


    return {

        month:
            now.getMonth() + 1,

        day:
            now.getDate()

    };

}


/* ==================================================
   今日の誕生日
================================================== */

function getBirthdayCharacters() {

    const today =
        getToday();


    return characters.filter(
        char => {

            if (!char.birthday) {

                return false;

            }


            return (

                Number(
                    char.birthday.month
                ) === today.month &&

                Number(
                    char.birthday.day
                ) === today.day

            );

        }
    );

}


/* ==================================================
   最初のキャラクター選択
================================================== */

async function chooseInitialCharacter() {

    const birthdayCharacters =
        getBirthdayCharacters();


    /*
       今日の誕生日が1人
    */

    if (
        birthdayCharacters.length === 1
    ) {

        await loadCharacter(
            birthdayCharacters[0]
        );

        return;

    }


    /*
       今日の誕生日が複数
       → 選択画面
    */

    if (
        birthdayCharacters.length > 1
    ) {

        showBirthdayChoice(
            birthdayCharacters
        );

        return;

    }


    /*
       誕生日なし
       → 144人からランダム
    */

    if (
        characters.length > 0
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                characters.length
            );


        await loadCharacter(
            characters[randomIndex]
        );

    }

}


/* ==================================================
   キャラクター読み込み
================================================== */

async function loadCharacter(char) {

    data = char;

    count = {};

    currentCostume = null;


    /*
       衣装あり
    */

    if (

        Array.isArray(
            data.costumes
        ) &&

        data.costumes.length > 0

    ) {

        currentCostume =
            data.costumes[0];

    }


    /*
       衣装なし
    */

    else {

        currentCostume = {

            id: "default",

            name: "通常",

            image:
                data.image,

            position:
                data.position || {},

            expressions: {}

        };

    }


    loadCostume();


    /*
       枠
    */

    loadFrame();


    /*
       メニューを閉じる
    */

    closeMenu();


    /*
       挨拶
    */

    showGreeting();

}


/* ==================================================
   衣装読み込み
================================================== */

function loadCostume() {

    const position =
        currentCostume.position ||
        data.position ||
        {};


    character.src =
        "images/" +
        currentCostume.image;


    character.style.left =
        (position.x || 0) +
        "px";


    character.style.top =
        (position.y || 0) +
        "px";


    character.style.width =
        (position.scale || 250) +
        "px";

}


/* ==================================================
   枠
================================================== */

function loadFrame() {

    /*
       JSONに

       "frame": "frame.png"

       があれば読み込む。

       なければ非表示。
    */

    if (
        data.frame
    ) {

        frame.src =
            "frames/" +
            data.frame;

        frame.style.display =
            "block";

    }

    else {

        frame.removeAttribute(
            "src"
        );

        frame.style.display =
            "none";

    }

}


/* ==================================================
   表情
================================================== */

function setExpression(expression) {

    const expressions =
        currentCostume.expressions ||
        {};


    /*
       表情指定なし
       → 通常表情
    */

    if (!expression) {

        character.src =
            "images/" +
            currentCostume.image;

        return;

    }


    /*
       指定された表情
    */

    if (
        expressions[expression]
    ) {

        character.src =
            "images/" +
            expressions[expression];

        return;

    }


    /*
       見つからない
       → 通常表情
    */

    character.src =
        "images/" +
        currentCostume.image;

}


/* ==================================================
   台詞表示
================================================== */

function showTalk(text, x, y) {

    if (!text) {

        return;

    }


    message.innerText =
        text;


    let messageX =
        x + 15;


    let messageY =
        y - 20;


    /*
       右端からはみ出さない
    */

    if (
        messageX + 420 >
        game.clientWidth
    ) {

        messageX =
            game.clientWidth - 440;

    }


    /*
       左端
    */

    if (
        messageX < 10
    ) {

        messageX = 10;

    }


    /*
       上端
    */

    if (
        messageY < 20
    ) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    /*
       アニメーション再実行
    */

    message.style.animation =
        "none";


    void message.offsetWidth;


    message.style.animation =
        "pop 0.2s ease-out";


    /*
       自動消去
    */

    if (messageTimer) {

        clearTimeout(
            messageTimer
        );

    }


    messageTimer =
        setTimeout(
            () => {

                message.style.display =
                    "none";

            },

            2500
        );

}


/* ==================================================
   喋る
================================================== */

function speak(talk, x, y) {

    if (!talk) {

        return;

    }


    setExpression(
        talk.expression
    );


    showTalk(
        talk.text,
        x,
        y
    );

}


/* ==================================================
   挨拶
================================================== */

function showGreeting() {

    if (

        !data.talk ||

        !Array.isArray(
            data.talk.greeting
        ) ||

        data.talk.greeting.length === 0

    ) {

        return;

    }


    speak(

        data.talk.greeting[0],

        game.clientWidth / 2,

        100

    );

}


/* ==================================================
   日付 → 数字
================================================== */

function dateNumber(value) {

    const parts =
        value.split("-");


    return (

        Number(parts[0]) * 100 +

        Number(parts[1])

    );

}


/* ==================================================
   期間
   年またぎ対応
================================================== */

function isInPeriod(start, end) {

    const today =
        getToday();


    const current =
        today.month * 100 +
        today.day;


    const startNumber =
        dateNumber(start);


    const endNumber =
        dateNumber(end);


    /*
       普通の期間
       04-01 ～ 08-31
    */

    if (
        startNumber <= endNumber
    ) {

        return (

            current >= startNumber &&

            current <= endNumber

        );

    }


    /*
       年またぎ
       12-01 ～ 02-28
    */

    return (

        current >= startNumber ||

        current <= endNumber

    );

}


/* ==================================================
   特別台詞
================================================== */

function getSpecialTalks() {

    const talks = [];

    const today =
        getToday();


    /*
       誕生日
    */

    if (

        data.birthday &&

        Number(
            data.birthday.month
        ) === today.month &&

        Number(
            data.birthday.day
        ) === today.day &&

        Array.isArray(
            data.birthday.talk
        )

    ) {

        talks.push(
            ...data.birthday.talk
        );

    }


    /*
       特定日
    */

    if (

        data.special &&

        Array.isArray(
            data.special.dates
        )

    ) {

        data.special.dates.forEach(
            item => {

                if (

                    Number(
                        item.month
                    ) === today.month &&

                    Number(
                        item.day
                    ) === today.day

                ) {

                    if (
                        Array.isArray(
                            item.talk
                        )
                    ) {

                        talks.push(
                            ...item.talk
                        );

                    }

                }

            }
        );

    }


    /*
       期間
    */

    if (

        data.special &&

        Array.isArray(
            data.special.periods
        )

    ) {

        data.special.periods.forEach(
            period => {

                if (

                    isInPeriod(
                        period.start,
                        period.end
                    )

                ) {

                    if (
                        Array.isArray(
                            period.talk
                        )
                    ) {

                        talks.push(
                            ...period.talk
                        );

                    }

                }

            }
        );

    }


    /*
       月
    */

    if (

        data.special &&

        data.special.months

    ) {

        const monthTalk =
            data.special.months[
                String(
                    today.month
                )
            ];


        if (
            Array.isArray(
                monthTalk
            )
        ) {

            talks.push(
                ...monthTalk
            );

        }

    }


    /*
       季節
    */

    const season =
        getSeason();


    if (

        data.special &&

        data.special.seasons &&

        Array.isArray(
            data.special.seasons[season]
        )

    ) {

        talks.push(
            ...data.special.seasons[season]
        );

    }


    return talks;

}


/* ==================================================
   通常台詞
================================================== */

function getNormalTalk() {

    const pool = [];


    /*
       通常台詞
    */

    if (

        data.talk &&

        Array.isArray(
            data.talk.normal
        )

    ) {

        pool.push(
            ...data.talk.normal
        );

    }


    /*
       季節・月・期間・イベント・誕生日
    */

    pool.push(
        ...getSpecialTalks()
    );


    if (
        pool.length === 0
    ) {

        return null;

    }


    const key =
        "normal";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        pool[
            count[key] %
            pool.length
        ];


    count[key]++;


    return talk;

}


/* ==================================================
   通常連打台詞
================================================== */

function getRapidTalk() {

    if (

        !data.talk ||

        !Array.isArray(
            data.talk.rapid
        ) ||

        data.talk.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        data.talk.rapid[
            count[key] %
            data.talk.rapid.length
        ];


    count[key]++;


    return talk;

}


/* ==================================================
   エリア判定
================================================== */

function inside(x, y, area) {

    return (

        x >= area.x &&

        x <=
            area.x +
            area.width &&

        y >= area.y &&

        y <=
            area.y +
            area.height

    );

}


function getArea(x, y) {

    if (

        !data ||

        !Array.isArray(
            data.areas
        )

    ) {

        return null;

    }


    /*
       後ろに書いたエリアを優先
    */

    for (

        let i =
            data.areas.length - 1;

        i >= 0;

        i--

    ) {

        const area =
            data.areas[i];


        if (
            inside(
                x,
                y,
                area
            )
        ) {

            return area;

        }

    }


    return null;

}


/* ==================================================
   エリア台詞
================================================== */

function getAreaTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.talk
        ) ||

        area.talk.length === 0

    ) {

        return null;

    }


    const key =
        "area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        area.talk[
            count[key] %
            area.talk.length
        ];


    count[key]++;


    return talk;

}


/* ==================================================
   エリア連打台詞
================================================== */

function getAreaRapidTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.rapid
        ) ||

        area.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid_area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        area.rapid[
            count[key] %
            area.rapid.length
        ];


    count[key]++;


    return talk;

}


/* ==================================================
   ゲームクリック
================================================== */

game.addEventListener(
    "click",
    function(event) {

        if (!data) {

            return;

        }


        /*
           メニューなどのUIをクリックした場合
           ゲームクリックとして扱わない
        */

        if (
            event.target !== game
        ) {

            return;

        }


        const rect =
            game.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const now =
            Date.now();


        const rapid =
            now - lastClick <
            RAPID_TIME;


        lastClick =
            now;


        /*
           ==============================
           エリア
           ==============================
        */

        const area =
            getArea(
                x,
                y
            );


        if (area) {

            /*
               エリア連打
            */

            if (rapid) {

                const rapidTalk =
                    getAreaRapidTalk(
                        area
                    );


                if (rapidTalk) {

                    speak(
                        rapidTalk,
                        x,
                        y
                    );

                    return;

                }

            }


            /*
               エリア通常
            */

            const areaTalk =
                getAreaTalk(
                    area
                );


            if (areaTalk) {

                speak(
                    areaTalk,
                    x,
                    y
                );

                return;

            }

        }


        /*
           ==============================
           キャラクター連打
           ==============================
        */

        if (rapid) {

            const rapidTalk =
                getRapidTalk();


            if (rapidTalk) {

                speak(
                    rapidTalk,
                    x,
                    y
                );

                return;

            }

        }


        /*
           ==============================
           通常台詞
           ==============================
        */

        const normalTalk =
            getNormalTalk();


        if (normalTalk) {

            speak(
                normalTalk,
                x,
                y
            );

        }

    }
);


/* ==================================================
   季節
================================================== */

function getSeason() {

    const month =
        new Date().getMonth() + 1;


    if (
        month >= 3 &&
        month <= 5
    ) {

        return "spring";

    }


    if (
        month >= 6 &&
        month <= 8
    ) {

        return "summer";

    }


    if (
        month >= 9 &&
        month <= 11
    ) {

        return "autumn";

    }


    return "winter";

}


/* ==================================================
   背景設定
================================================== */

function setBackground(bg) {

    currentBackground =
        bg;


    background.src =
        "backgrounds/" +
        bg.image;

}


/* ==================================================
   起動時背景
================================================== */

function setupBackground() {

    const season =
        getSeason();


    const seasonal =
        backgrounds.find(
            bg =>
                bg.season === season
        );


    if (seasonal) {

        setBackground(
            seasonal
        );

    }

}


/* ==================================================
   背景メニュー
   JPEGそのものをサムネイルにする
================================================== */

function setupBackgroundMenu() {

    backgroundList.innerHTML =
        "";


    backgrounds.forEach(
        bg => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            /*
               元JPEGをそのまま使用
            */

            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "card-background-image";


            img.src =
                "backgrounds/" +
                bg.image;


            img.alt =
                bg.name;


            card.appendChild(
                img
            );


            /*
               背景名
            */

            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "card-name";


            name.innerText =
                bg.name;


            card.appendChild(
                name
            );


            /*
               背景選択
            */

            card.onclick =
                () => {

                    setBackground(
                        bg
                    );

                    closeMenu();

                };


            backgroundList.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   キャラクター一覧
================================================== */

function setupCharacterMenu() {

    characterList.innerHTML =
        "";


    characters.forEach(
        char => {

            characterList.appendChild(
                createCharacterCard(
                    char
                )
            );

        }
    );

}


/* ==================================================
   キャラクターカード
================================================== */

function createCharacterCard(char) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "card-character-image";


    img.src =
        "images/" +
        char.image;


    img.alt =
        char.name;


    /*
       キャラクター一覧の顔切り取り用設定。

       JSONに

       "menu": {
           "face": {
               "x": 100,
               "y": 50,
               "width": 200,
               "height": 200
           }
       }

       があれば将来的にここで利用可能。

       現在は通常画像を使用。
    */


    card.appendChild(
        img
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "card-name";


    name.innerText =
        char.name;


    card.appendChild(
        name
    );


    card.onclick =
        async () => {

            await loadCharacter(
                char
            );

        };


    return card;

}


/* ==================================================
   誕生日メニュー
================================================== */

function setupBirthdayMenu() {

    const birthdayCharacters =
        getBirthdayCharacters();


    birthdayList.innerHTML =
        "";


    /*
       誕生日なし
    */

    if (
        birthdayCharacters.length === 0
    ) {

        birthdayList.innerHTML =
            '<div class="birthday-empty">' +
            '今日は誕生日のキャラクターはいません。' +
            '</div>';


        birthdayIcon.style.display =
            "none";


        return;

    }


    /*
       誕生日あり
    */

    birthdayIcon.style.display =
        "block";


    birthdayCharacters.forEach(
        char => {

            birthdayList.appendChild(
                createCharacterCard(
                    char
                )
            );

        }
    );

}


/* ==================================================
   複数誕生日の選択画面
================================================== */

function showBirthdayChoice(
    birthdayCharacters
) {

    menu.style.display =
        "block";


    birthdayArea.style.display =
        "block";


    characterSection.classList.add(
        "hidden"
    );


    backgroundSection.classList.add(
        "hidden"
    );


    birthdayList.innerHTML =
        "";


    birthdayCharacters.forEach(
        char => {

            birthdayList.appendChild(
                createCharacterCard(
                    char
                )
            );

        }
    );

}


/* ==================================================
   メニューを開く
================================================== */

function openMenu() {

    menu.style.display =
        "block";


    birthdayArea.style.display =
        "block";

}


/* ==================================================
   メニューを閉じる
================================================== */

function closeMenu() {

    menu.style.display =
        "none";

}


/* ==================================================
   メニュー操作
================================================== */

document
    .getElementById(
        "openMenu"
    )
    .onclick =
    () => {

        openMenu();

    };


document
    .getElementById(
        "closeMenu"
    )
    .onclick =
    () => {

        closeMenu();

    };


/*
   キャラクター選択
*/

document
    .getElementById(
        "characterMenuButton"
    )
    .onclick =
    () => {

        characterSection.classList.remove(
            "hidden"
        );


        backgroundSection.classList.add(
            "hidden"
        );


        birthdayArea.style.display =
            "none";


        setupCharacterMenu();

    };


/*
   背景選択
*/

document
    .getElementById(
        "backgroundMenuButton"
    )
    .onclick =
    () => {

        characterSection.classList.add(
            "hidden"
        );


        backgroundSection.classList.remove(
            "hidden"
        );


        birthdayArea.style.display =
            "none";


        setupBackgroundMenu();

    };


/*
   誕生日アイコン
*/

birthdayIcon.onclick =
    () => {

        openMenu();


        characterSection.classList.add(
            "hidden"
        );


        backgroundSection.classList.add(
            "hidden"
        );


        birthdayArea.style.display =
            "block";

    };


/* ==================================================
   起動
================================================== */

init();

</script>
