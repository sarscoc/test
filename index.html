<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ==================================================
   基本
================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    position: relative;
    background: transparent;
    font-family: sans-serif;
}


/* ==================================================
   背景
================================================== */

#background {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   キャラクター
================================================== */

#character {
    position: fixed;

    z-index: 10;

    pointer-events: none;

    transform-origin: center center;
}


/* ==================================================
   枠
================================================== */

#frame {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 20;
}


/* ==================================================
   個人ページ
================================================== */

#personalPage {
    position: fixed;

    right: 20px;
    top: 20px;

    z-index: 50;

    color: inherit;
    text-decoration: none;

    font-size: 13px;
}


/* ==================================================
   メニューボタン
================================================== */

#openMenu {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 38px;
    height: 38px;

    z-index: 100;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.75);

    font-size: 18px;

    cursor: pointer;
}


/* ==================================================
   台詞
================================================== */

#message {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    z-index: 40;

    max-width: 80%;

    pointer-events: none;
}


/* ==================================================
   メニュー
================================================== */

#menu {
    position: fixed;

    inset: 0;

    z-index: 90;

    display: none;

    background: rgba(255,255,255,0.94);

    padding: 30px;
}

#menu.open {
    display: block;
}


/* ==================================================
   非表示
================================================== */

.hidden {
    display: none !important;
}


/* ==================================================
   誕生日
================================================== */

#birthdayArea {
    width: 100%;
    height: 100%;
}

#birthdayList {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    font-size: 18px;
}

.birthday-item {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    cursor: pointer;
}


/* ==================================================
   リスト
================================================== */

.list {
    display: flex;

    flex-direction: column;

    gap: 8px;
}


/* ==================================================
   Character / Background
   右下に小さく
================================================== */

.menu-buttons {
    position: absolute;

    right: 20px;
    bottom: 18px;

    display: flex;

    gap: 5px;

    z-index: 110;
}

.menu-button {
    padding: 4px 7px;

    border: none;

    background: transparent;

    color: #555;

    font-size: 11px;

    cursor: pointer;

    opacity: 0.55;
}

.menu-button:hover {
    opacity: 1;
}


/* ==================================================
   背景選択
================================================== */

#backgroundSection,
#characterSection {
    width: 100%;
    height: 100%;

    overflow-y: auto;
}

#backgroundSection h2 {
    margin-top: 0;
}

</style>
</head>

<body>


<!-- ==================================================
     背景
================================================== -->

<img
    id="background"
    alt=""
>


<!-- ==================================================
     キャラクター
================================================== -->

<img
    id="character"
    alt=""
>


<!-- ==================================================
     枠
================================================== -->

<img
    id="frame"
    alt=""
>


<!-- ==================================================
     個人ページ
================================================== -->

<a
    id="personalPage"
    href="#"
    target="_blank"
    rel="noopener"
    title="キャラクター個人ページ"
>
    ↗ 個人ページ
</a>


<!-- ==================================================
     メニューボタン
================================================== -->

<button
    id="openMenu"
    type="button"
>
    ☰
</button>


<!-- ==================================================
     台詞
================================================== -->

<div id="message"></div>


<!-- ==================================================
     メニュー本体
================================================== -->

<div id="menu">


    <!-- 今日の誕生日 -->

    <section id="birthdayArea">

        <div
            id="birthdayList"
            class="list"
        ></div>

    </section>


    <!-- キャラクター -->

    <section
        id="characterSection"
        class="hidden"
    >

        <div
            id="characterList"
            class="list"
        ></div>

    </section>


    <!-- 背景 -->

    <section
        id="backgroundSection"
        class="hidden"
    >

        <h2>
            背景選択
        </h2>

        <div
            id="backgroundList"
            class="list"
        ></div>

    </section>


    <!-- 右下の小さいメニュー -->

    <div class="menu-buttons">

        <button
            class="menu-button"
            id="characterMenuButton"
            type="button"
        >
            Character
        </button>

        <button
            class="menu-button"
            id="backgroundMenuButton"
            type="button"
        >
            Background
        </button>

    </div>

</div>


<script>

/* ==================================================
   要素
================================================== */

const menu =
    document.getElementById("menu");

const openMenu =
    document.getElementById("openMenu");

const characterMenuButton =
    document.getElementById("characterMenuButton");

const backgroundMenuButton =
    document.getElementById("backgroundMenuButton");

const birthdayArea =
    document.getElementById("birthdayArea");

const birthdayList =
    document.getElementById("birthdayList");

const characterSection =
    document.getElementById("characterSection");

const backgroundSection =
    document.getElementById("backgroundSection");


/* ==================================================
   メニューを開く
================================================== */

openMenu.addEventListener("click", function(event) {

    event.stopPropagation();

    menu.classList.add("open");

});


/* ==================================================
   メニューを閉じる
   Backボタンは使用しない
================================================== */

function closeMenu() {

    menu.classList.remove("open");

    birthdayArea.classList.remove("hidden");

    characterSection.classList.add("hidden");

    backgroundSection.classList.add("hidden");

}


/* ==================================================
   空白をクリックしたら閉じる
================================================== */

menu.addEventListener("click", function(event) {

    /*
     * ボタンやリストをクリックした場合は
     * 「空白」ではないので閉じない
     */

    if (
        event.target.closest("button") ||
        event.target.closest(".list") ||
        event.target.closest("a")
    ) {
        return;
    }

    closeMenu();

});


/* ==================================================
   Character
================================================== */

characterMenuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        birthdayArea.classList.add("hidden");

        backgroundSection.classList.add("hidden");

        characterSection.classList.remove("hidden");

    }
);


/* ==================================================
   Background
================================================== */

backgroundMenuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        birthdayArea.classList.add("hidden");

        characterSection.classList.add("hidden");

        backgroundSection.classList.remove("hidden");

    }
);


/* ==================================================
   誕生日表示
================================================== */

/*
 * キャラクターJSONを読み込んだあと、
 *
 * birthdayList.innerHTML = ...
 *
 * の部分で以下の関数を使えます。
 */

function showBirthday(character) {

    birthdayList.innerHTML = "";

    if (!character || !character.birthday) {
        return;
    }

    const item =
        document.createElement("div");

    item.className =
        "birthday-item";

    /*
     * 名前の横に🎂だけ表示
     */

    item.textContent =
        character.name + " 🎂";

    /*
     * 個人ページが設定されている場合
     */

    if (character.page) {

        item.addEventListener(
            "click",
            function() {

                window.open(
                    character.page,
                    "_blank",
                    "noopener"
                );

            }
        );

    }

    birthdayList.appendChild(item);

}


/* ==================================================
   今日が誕生日か判定
================================================== */

function isBirthday(character) {

    if (!character || !character.birthday) {
        return false;
    }

    const today =
        new Date();

    return (
        Number(character.birthday.month)
        ===
        today.getMonth() + 1

        &&

        Number(character.birthday.day)
        ===
        today.getDate()
    );

}


/* ==================================================
   誕生日一覧
================================================== */

function showBirthdays(characters) {

    birthdayList.innerHTML = "";

    if (!Array.isArray(characters)) {
        return;
    }

    const birthdays =
        characters.filter(
            isBirthday
        );

    birthdays.forEach(
        function(character) {

            const item =
                document.createElement("div");

            item.className =
                "birthday-item";

            item.textContent =
                character.name + " 🎂";

            if (character.page) {

                item.addEventListener(
                    "click",
                    function() {

                        window.open(
                            character.page,
                            "_blank",
                            "noopener"
                        );

                    }
                );

            }

            birthdayList.appendChild(item);

        }
    );

}


/* ==================================================
   画面外クリック対策
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {
            closeMenu();
        }

    }
);

</script>

</body>
</html>
