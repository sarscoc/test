<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Game</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body {
    background: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}

/* ゲーム本体 */
#game {
    position: relative;
    width: 900px;
    height: 506px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
    user-select: none;
}

#background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
#character { position: absolute; z-index: 10; object-fit: contain; pointer-events: none; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: none; }

/* 台詞吹出し */
#message {
    position: absolute;
    z-index: 100;
    display: none;
    max-width: 420px;
    padding: 14px 22px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
    font-size: 20px;
    line-height: 1.5;
    pointer-events: none;
}

/* 個人ページ */
#personalPage {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 200;
    display: none;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,.9);
    color: #333;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
}
#personalPage:hover { background: #fff; }

/* メニューボタン */
#openMenu {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 200;
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.9);
    cursor: pointer;
    font-size: 18px;
}

/* メニュー画面 */
#menu {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: none;
    overflow-y: auto;
    padding: 30px;
    background: rgba(255,255,255,.97);
}
#menu h1, #menu h2 { margin-top: 0; }

.menu-buttons {
    position: absolute;
    right: 15px;
    bottom: 12px;
    display: flex;
    gap: 4px;
    margin: 0;
    z-index: 510;
}
.menu-button {
    border: none;
    padding: 4px 7px;
    border-radius: 5px;
    background: transparent;
    color: #555;
    cursor: pointer;
    font-size: 11px;
    opacity: .55;
}
.menu-button:hover { background: #f5f5f5; opacity: 1; }

/* カード一覧 */
.list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.card {
    overflow: hidden;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    text-align: center;
}
.card:hover { background: #f5f5f5; }

.card-character-thumb {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 8px;
    overflow: hidden;
    border-radius: 50%;
}
.card-character-image { display: block; width: 100%; height: 100%; object-fit: cover; }
.card-background-image { display: block; width: 100%; height: 80px; margin-bottom: 8px; object-fit: cover; border-radius: 8px; }
.card-name { font-size: 14px; }

/* 誕生日表示 */
#birthdayArea { margin-bottom: 25px; }
.birthday-empty { color: #888; }
.birthday-item {
    display: inline-flex;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
}
.birthday-item:hover { background: #f5f5f5; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game">
    <img id="background" alt="">
    <img id="character" alt="">
    <img id="frame" alt="">
    
    <a id="personalPage" href="#" target="_blank" rel="noopener" title="キャラクター個人ページ">↗ 個人ページ</a>
    <button id="openMenu" type="button">☰</button>
    <div id="message"></div>

    <div id="menu">
        <section id="birthdayArea">
            <div id="birthdayList" class="list"></div>
        </section>

        <section id="costumeSection" class="hidden">
            <h2>衣装選択</h2>
            <div id="costumeList" class="list"></div>
        </section>

        <section id="characterSection" class="hidden">
            <div id="characterList" class="list"></div>
        </section>

        <section id="backgroundSection" class="hidden">
            <h2>背景選択</h2>
            <div id="backgroundList" class="list"></div>
        </section>

        <div class="menu-buttons">
            <button class="menu-button" id="characterMenuButton" type="button">Character</button>
            <button class="menu-button" id="backgroundMenuButton" type="button">Background</button>
        </div>
    </div>
</div>

const characterList = document.getElementById("characterList");
const backgroundList = document.getElementById("backgroundList");
const characterSection = document.getElementById("characterSection");
const backgroundSection = document.getElementById("backgroundSection");

        alert("ゲームデータを読み込めませんでした。");
