<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: sans-serif;

}


/* =========================
   ゲーム画面
========================= */

#game {

    width: 900px;

    height: 506px;

    position: relative;

    overflow: hidden;

    background: white;

    border: 2px solid #999;

    cursor: pointer;

}


/* =========================
   キャラクター
========================= */

#character {

    position: absolute;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;

}


/* =========================
   台詞
========================= */

#message {

    position: absolute;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: white;

    border-radius: 24px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    z-index: 1000;

}


@keyframes pop {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   デバッグ用エリア
========================= */

.debug-area {

    position: absolute;

    border: 2px dashed rgba(255,0,0,0.8);

    background:
        rgba(255,0,0,0.12);

    pointer-events: none;

    z-index: 500;

}


.debug-area-name {

    position: absolute;

    left: -2px;

    top: -24px;

    padding: 2px 7px;

    background:
        rgba(255,0,0,0.8);

    color: white;

    font-size: 13px;

    white-space: nowrap;

    border-radius: 4px;

}


/* =========================
   ステータス
========================= */

#status {

    position: absolute;

    left: 10px;

    bottom: 10px;

    padding: 5px 10px;

    background:
        rgba(0,0,0,0.7);

    color: white;

    font-size: 12px;

    border-radius: 5px;

    z-index: 2000;

}

</style>

</head>


<body>


<div id="game">

    <img id="character">

    <div id="message"></div>

    <div id="status">
        読み込み中……
    </div>

</div>


<script>


/* ==================================================
   基本
================================================== */

const game =
    document.getElementById("game");


const character =
    document.getElementById("character");


const message =
    document.getElementById("message");


const status =
    document.getElementById("status");


let data = null;


/*
   台詞の再生位置

   normal
   rapid
   area_エリア名
   rapid_エリア名

   のように管理する
*/

const count = {};


/*
   前回クリックした時刻
*/

let lastClick = 0;


/*
   台詞を消すタイマー
*/

let messageTimer = null;


/*
   連打判定時間

   400ms以内なら連打
*/

const RAPID_TIME = 400;



/* ==================================================
   JSON読み込み
================================================== */

fetch("characters/143.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "143.json を読み込めませんでした。"
        );

    }

    return response.json();

})

.then(json => {

    data = json;

    status.innerText =
        data.name + " 読み込み完了";


    loadCharacter();

    drawAreas();

    showGreeting();

})

.catch(error => {

    console.error(error);

    status.innerText =
        "読み込みエラー: " +
        error.message;

});



/* ==================================================
   キャラクター表示
================================================== */

function loadCharacter() {

    if (!data.image) {

        status.innerText =
            "画像ファイルが指定されていません。";

        return;

    }


    character.src =
        "images/" + data.image;


    character.onload = function() {

        status.innerText =
            data.name + " 読み込み完了";

    };


    character.onerror = function() {

        status.innerText =
            "画像を読み込めません: " +
            data.image;

    };


    const position =
        data.position || {};


    character.style.left =
        (position.x || 0) + "px";


    character.style.top =
        (position.y || 0) + "px";


    character.style.width =
        (position.scale || 250) + "px";

}



/* ==================================================
   エリア表示
================================================== */

function drawAreas() {

    /*
       古いエリアを削除
    */

    document
        .querySelectorAll(".debug-area")
        .forEach(element => {

            element.remove();

        });


    if (
        !data ||
        !Array.isArray(data.areas)
    ) {

        return;

    }


    data.areas.forEach(
        (area, index) => {

            const box =
                document.createElement("div");


            box.className =
                "debug-area";


            box.style.left =
                area.x + "px";


            box.style.top =
                area.y + "px";


            box.style.width =
                area.width + "px";


            box.style.height =
                area.height + "px";


            const name =
                document.createElement("div");


            name.className =
                "debug-area-name";


            name.innerText =
                area.name ||
                "エリア" + (index + 1);


            box.appendChild(name);


            game.appendChild(box);

        }
    );

}



/* ==================================================
   起動時台詞
================================================== */

function showGreeting() {

    if (
        !data.talk ||
        !Array.isArray(data.talk.greeting) ||
        data.talk.greeting.length === 0
    ) {

        return;

    }


    const talk =
        data.talk.greeting[0];


    showTalk(
        talk.text,
        game.clientWidth / 2,
        100
    );

}



/* ==================================================
   台詞表示
================================================== */

function showTalk(text, x, y) {

    if (!text) {

        return;

    }


    message.innerText =
        text;


    /*
       クリック位置の少し右上
    */

    let messageX =
        x + 15;


    let messageY =
        y - 20;


    /*
       右端からはみ出さない
    */

    if (
        messageX + 420 >
        game.clientWidth
    ) {

        messageX =
            game.clientWidth - 440;

    }


    /*
       左端
    */

    if (messageX < 10) {

        messageX = 10;

    }


    /*
       上端
    */

    if (messageY < 20) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    /*
       アニメーションを
       毎回再実行
    */

    message.style.animation =
        "none";


    void message.offsetWidth;


    message.style.animation =
        "pop 0.2s ease-out";


    /*
       前のタイマーを削除
    */

    if (messageTimer) {

        clearTimeout(messageTimer);

    }


    /*
       2.5秒後に消す
    */

    messageTimer =
        setTimeout(() => {

            message.style.display =
                "none";

        }, 2500);

}



/* ==================================================
   座標がエリア内か
================================================== */

function inside(x, y, area) {

    return (

        x >= area.x &&

        x <=
            area.x + area.width &&

        y >= area.y &&

        y <=
            area.y + area.height

    );

}



/* ==================================================
   エリア取得
================================================== */

function getArea(x, y) {

    if (
        !data ||
        !Array.isArray(data.areas)
    ) {

        return null;

    }


    /*
       後に登録されたエリアを優先
    */

    for (
        let i = data.areas.length - 1;
        i >= 0;
        i--
    ) {

        const area =
            data.areas[i];


        if (
            inside(x, y, area)
        ) {

            return area;

        }

    }


    return null;

}



/* ==================================================
   通常エリア台詞
================================================== */

function getAreaTalk(area) {

    if (
        !area ||
        !Array.isArray(area.talk) ||
        area.talk.length === 0
    ) {

        return null;

    }


    const key =
        "area_" + area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.talk[
            Math.min(
                index,
                area.talk.length - 1
            )
        ];


    /*
       最後の台詞まで行ったら
       最後の台詞を繰り返す
    */

    if (
        count[key] <
        area.talk.length - 1
    ) {

        count[key]++;

    }


    return talk;

}



/* ==================================================
   エリア連打台詞
================================================== */

function getAreaRapidTalk(area) {

    if (
        !area ||
        !Array.isArray(area.rapid) ||
        area.rapid.length === 0
    ) {

        return null;

    }


    const key =
        "rapid_" + area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.rapid[
            Math.min(
                index,
                area.rapid.length - 1
            )
        ];


    if (
        count[key] <
        area.rapid.length - 1
    ) {

        count[key]++;

    }


    return talk;

}



/* ==================================================
   キャラ通常台詞
================================================== */

function getNormalTalk() {

    if (
        !data.talk ||
        !Array.isArray(data.talk.normal) ||
        data.talk.normal.length === 0
    ) {

        return null;

    }


    const key =
        "normal";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        data.talk.normal[
            Math.min(
                index,
                data.talk.normal.length - 1
            )
        ];


    if (
        count[key] <
        data.talk.normal.length - 1
    ) {

        count[key]++;

    }


    return talk;

}



/* ==================================================
   キャラ連打台詞
================================================== */

function getRapidTalk() {

    if (
        !data.talk ||
        !Array.isArray(data.talk.rapid) ||
        data.talk.rapid.length === 0
    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        data.talk.rapid[
            Math.min(
                index,
                data.talk.rapid.length - 1
            )
        ];


    if (
        count[key] <
        data.talk.rapid.length - 1
    ) {

        count[key]++;

    }


    return talk;

}



/* ==================================================
   クリック処理
================================================== */

game.addEventListener(
    "click",
    function(e) {

        /*
           JSON読み込み前
        */

        if (!data) {

            return;

        }


        /*
           ゲーム画面内の座標に変換
        */

        const rect =
            game.getBoundingClientRect();


        const x =
            e.clientX - rect.left;


        const y =
            e.clientY - rect.top;


        /*
           連打判定
        */

        const now =
            Date.now();


        const rapid =
            now - lastClick <
            RAPID_TIME;


        lastClick =
            now;



        /* ==========================================
           エリア判定
        ========================================== */

        const area =
            getArea(x, y);


        if (area) {

            /*
               エリア内で連打
               ↓
               エリア専用rapid
            */

            if (
                rapid &&
                Array.isArray(area.rapid) &&
                area.rapid.length > 0
            ) {

                const talk =
                    getAreaRapidTalk(area);


                if (talk) {

                    showTalk(
                        talk.text,
                        x,
                        y
                    );

                    return;

                }

            }


            /*
               エリア内で通常クリック
               ↓
               エリア専用talk
            */

            const talk =
                getAreaTalk(area);


            if (talk) {

                showTalk(
                    talk.text,
                    x,
                    y
                );

                return;

            }


            /*
               エリアにtalkがない場合は
               通常台詞へ
            */

        }



        /* ==========================================
           エリア外の連打
        ========================================== */

        if (rapid) {

            const talk =
                getRapidTalk();


            if (talk) {

                showTalk(
                    talk.text,
                    x,
                    y
                );

                return;

            }

        }



        /* ==========================================
           通常クリック
        ========================================== */

        const talk =
            getNormalTalk();


        if (talk) {

            showTalk(
                talk.text,
                x,
                y
            );

        }

    }
);


</script>

</body>

</html>
