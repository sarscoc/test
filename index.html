<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #eee;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: sans-serif;

}


/* ==================================================
   ゲーム全体
================================================== */

#game {

    width: 900px;

    height: 506px;

    position: relative;

    overflow: hidden;

    background: white;

    cursor: pointer;

}


/* ==================================================
   背景
================================================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    z-index: 0;

}


/* ==================================================
   キャラクター
================================================== */

#character {

    position: absolute;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;

    z-index: 10;

}


/* ==================================================
   枠
================================================== */

#frame {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

    z-index: 20;

}


/* ==================================================
   台詞
================================================== */

#message {

    position: absolute;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: white;

    border-radius: 24px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    z-index: 100;

}


@keyframes pop {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ==================================================
   メニュー
================================================== */

#menu {

    position: absolute;

    inset: 0;

    z-index: 500;

    background: rgba(255,255,255,0.96);

    display: none;

    overflow: auto;

    padding: 30px;

}


#menu h1 {

    margin-top: 0;

}


.menu-buttons {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}


.menu-button {

    border: 1px solid #bbb;

    background: white;

    border-radius: 10px;

    padding: 10px 16px;

    cursor: pointer;

    font-size: 16px;

}


.menu-button:hover {

    background: #f3f3f3;

}


/* ==================================================
   一覧
================================================== */

.list {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(120px, 1fr));

    gap: 12px;

}


.card {

    border: 1px solid #ddd;

    background: white;

    border-radius: 12px;

    padding: 10px;

    cursor: pointer;

    text-align: center;

}


.card:hover {

    background: #f7f7f7;

}


.card img {

    width: 80px;

    height: 80px;

    object-fit: cover;

    display: block;

    margin: 0 auto 8px;

    border-radius: 50%;

}


.card-name {

    font-size: 14px;

}


/* ==================================================
   誕生日
================================================== */

#birthdayArea {

    margin-bottom: 25px;

}


.birthday-title {

    font-size: 20px;

    margin-bottom: 10px;

}


.birthday-empty {

    color: #888;

}


.hidden {

    display: none !important;

}


/* ==================================================
   メニューを開くボタン
================================================== */

#openMenu {

    position: absolute;

    top: 12px;

    right: 12px;

    z-index: 200;

    border: none;

    background: rgba(255,255,255,0.85);

    border-radius: 10px;

    padding: 8px 12px;

    cursor: pointer;

}


/* ==================================================
   誕生日アイコン
================================================== */

#birthdayIcon {

    position: absolute;

    top: 12px;

    left: 12px;

    z-index: 200;

    border: none;

    background: rgba(255,255,255,0.9);

    border-radius: 50%;

    width: 42px;

    height: 42px;

    cursor: pointer;

    display: none;

    font-size: 20px;

}


</style>

</head>


<body>


<div id="game">


    <!-- 背景 -->

    <img
        id="background"
        alt=""
    >


    <!-- キャラクター -->

    <img
        id="character"
        alt=""
    >


    <!-- 枠 -->

    <img
        id="frame"
        alt=""
    >


    <!-- 台詞 -->

    <div id="message"></div>


    <!-- 誕生日アイコン -->

    <button
        id="birthdayIcon"
        title="今日の誕生日"
    >
        🎂
    </button>


    <!-- メニューボタン -->

    <button
        id="openMenu"
    >
        ☰
    </button>


    <!-- メニュー -->

    <div id="menu">

        <h1>Character Game</h1>


        <div class="menu-buttons">

            <button
                class="menu-button"
                id="characterMenuButton"
            >
                👤 キャラクター選択
            </button>


            <button
                class="menu-button"
                id="backgroundMenuButton"
            >
                🖼 背景選択
            </button>


            <button
                class="menu-button"
                id="closeMenu"
            >
                ゲームに戻る
            </button>

        </div>


        <!-- 誕生日 -->

        <section id="birthdayArea">

            <div class="birthday-title">
                🎂 今日の誕生日
            </div>

            <div
                id="birthdayList"
                class="list"
            ></div>

        </section>


        <!-- キャラクター一覧 -->

        <section
            id="characterSection"
            class="hidden"
        >

            <h2>
                キャラクター選択
            </h2>

            <div
                id="characterList"
                class="list"
            ></div>

        </section>


        <!-- 背景一覧 -->

        <section
            id="backgroundSection"
            class="hidden"
        >

            <h2>
                背景選択
            </h2>

            <div
                id="backgroundList"
                class="list"
            ></div>

        </section>

    </div>


</div>



<script>


/* ==================================================
   DOM
================================================== */

const game =
    document.getElementById("game");


const background =
    document.getElementById("background");


const character =
    document.getElementById("character");


const frame =
    document.getElementById("frame");


const message =
    document.getElementById("message");


const menu =
    document.getElementById("menu");


const birthdayIcon =
    document.getElementById("birthdayIcon");


const birthdayList =
    document.getElementById("birthdayList");


const characterList =
    document.getElementById("characterList");


const backgroundList =
    document.getElementById("backgroundList");


const characterSection =
    document.getElementById("characterSection");


const backgroundSection =
    document.getElementById("backgroundSection");



/* ==================================================
   状態
================================================== */

let characters = [];

let data = null;

let currentCostume = null;

let currentBackground = null;

let count = {};

let lastClick = 0;

const RAPID_TIME = 400;

let messageTimer = null;



/* ==================================================
   起動
================================================== */

async function init() {

    try {

        await loadCharacters();

        setupBackground();

        setupBirthdayMenu();

        await chooseInitialCharacter();

    }

    catch (error) {

        console.error(error);

        alert(
            "ゲームデータを読み込めませんでした。"
        );

    }

}



/* ==================================================
   キャラクター一覧読み込み
================================================== */

async function loadCharacters() {

    const response =
        await fetch(
            "characters/index.json"
        );


    if (!response.ok) {

        throw new Error(
            "characters/index.json がありません。"
        );

    }


    const files =
        await response.json();


    const loaded = [];


    for (
        const file of files
    ) {

        try {

            const result =
                await fetch(
                    "characters/" +
                    file
                );


            if (!result.ok) {

                continue;

            }


            const json =
                await result.json();


            loaded.push(json);

        }

        catch (error) {

            console.error(
                file,
                error
            );

        }

    }


    characters =
        loaded;

}



/* ==================================================
   今日の日付
================================================== */

function getToday() {

    const now =
        new Date();


    return {

        month:
            now.getMonth() + 1,

        day:
            now.getDate()

    };

}



/* ==================================================
   今日の誕生日
================================================== */

function getBirthdayCharacters() {

    const today =
        getToday();


    return characters.filter(
        char =>

            char.birthday &&

            Number(
                char.birthday.month
            ) === today.month &&

            Number(
                char.birthday.day
            ) === today.day

    );

}



/* ==================================================
   起動時キャラクター選択
================================================== */

async function chooseInitialCharacter() {

    const birthdayCharacters =
        getBirthdayCharacters();


    /*
       誕生日が1人
       → 即決
    */

    if (
        birthdayCharacters.length === 1
    ) {

        await loadCharacter(
            birthdayCharacters[0]
        );

        return;

    }


    /*
       誕生日が複数
       → 選択画面
    */

    if (
        birthdayCharacters.length > 1
    ) {

        showBirthdayChoice(
            birthdayCharacters
        );

        return;

    }


    /*
       誕生日なし
       → 144人からランダム
    */

    if (
        characters.length > 0
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                characters.length
            );


        await loadCharacter(
            characters[randomIndex]
        );

    }

}



/* ==================================================
   キャラクター読み込み
================================================== */

async function loadCharacter(char) {

    data = char;

    count = {};

    currentCostume = null;


    /*
       衣装
    */

    if (

        Array.isArray(
            data.costumes
        ) &&

        data.costumes.length > 0

    ) {

        currentCostume =
            data.costumes[0];

    }

    else {

        currentCostume = {

            id: "default",

            name: "通常",

            image:
                data.image,

            position:
                data.position || {},

            expressions: {}

        };

    }


    loadCostume();


    /*
       メニューを閉じる
    */

    menu.style.display =
        "none";


    /*
       ゲーム開始時の挨拶
    */

    showGreeting();

}



/* ==================================================
   衣装
================================================== */

function loadCostume() {

    const position =
        currentCostume.position ||
        data.position ||
        {};


    character.src =
        "images/" +
        currentCostume.image;


    character.style.left =
        (position.x || 0) +
        "px";


    character.style.top =
        (position.y || 0) +
        "px";


    character.style.width =
        (position.scale || 250) +
        "px";

}



/* ==================================================
   表情
================================================== */

function setExpression(expression) {

    const expressions =
        currentCostume.expressions ||
        {};


    /*
       表情指定なし
       → 通常顔
    */

    if (!expression) {

        character.src =
            "images/" +
            currentCostume.image;

        return;

    }


    /*
       表情あり
    */

    if (
        expressions[expression]
    ) {

        character.src =
            "images/" +
            expressions[expression];

        return;

    }


    /*
       存在しない場合
       → 通常顔
    */

    character.src =
        "images/" +
        currentCostume.image;

}



/* ==================================================
   台詞表示
================================================== */

function showTalk(text, x, y) {

    if (!text) {

        return;

    }


    message.innerText =
        text;


    let messageX =
        x + 15;


    let messageY =
        y - 20;


    if (
        messageX + 420 >
        game.clientWidth
    ) {

        messageX =
            game.clientWidth - 440;

    }


    if (
        messageX < 10
    ) {

        messageX = 10;

    }


    if (
        messageY < 20
    ) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    message.style.animation =
        "none";


    void message.offsetWidth;


    message.style.animation =
        "pop 0.2s ease-out";


    if (messageTimer) {

        clearTimeout(
            messageTimer
        );

    }


    messageTimer =
        setTimeout(

            () => {

                message.style.display =
                    "none";

            },

            2500

        );

}



/* ==================================================
   喋る
================================================== */

function speak(talk, x, y) {

    if (!talk) {

        return;

    }


    setExpression(
        talk.expression
    );


    showTalk(
        talk.text,
        x,
        y
    );

}



/* ==================================================
   挨拶
================================================== */

function showGreeting() {

    if (

        !data.talk ||

        !Array.isArray(
            data.talk.greeting
        ) ||

        data.talk.greeting.length === 0

    ) {

        return;

    }


    speak(

        data.talk.greeting[0],

        game.clientWidth / 2,

        100

    );

}



/* ==================================================
   日付
================================================== */

function dateNumber(value) {

    const parts =
        value.split("-");


    return (

        Number(parts[0]) * 100 +

        Number(parts[1])

    );

}



/* ==================================================
   期間
================================================== */

function isInPeriod(start, end) {

    const today =
        getToday();


    const current =
        today.month * 100 +
        today.day;


    const startNumber =
        dateNumber(start);


    const endNumber =
        dateNumber(end);


    /*
       年内
    */

    if (
        startNumber <= endNumber
    ) {

        return (

            current >= startNumber &&

            current <= endNumber

        );

    }


    /*
       年またぎ
    */

    return (

        current >= startNumber ||

        current <= endNumber

    );

}



/* ==================================================
   特別台詞
================================================== */

function getSpecialTalks() {

    const talks = [];

    const today =
        getToday();


    /*
       誕生日
    */

    if (

        data.birthday &&

        Number(
            data.birthday.month
        ) === today.month &&

        Number(
            data.birthday.day
        ) === today.day &&

        Array.isArray(
            data.birthday.talk
        )

    ) {

        talks.push(
            ...data.birthday.talk
        );

    }


    /*
       特定日
    */

    if (

        data.special &&

        Array.isArray(
            data.special.dates
        )

    ) {

        data.special.dates.forEach(
            item => {

                if (

                    Number(
                        item.month
                    ) === today.month &&

                    Number(
                        item.day
                    ) === today.day

                ) {

                    if (
                        Array.isArray(
                            item.talk
                        )
                    ) {

                        talks.push(
                            ...item.talk
                        );

                    }

                }

            }
        );

    }


    /*
       期間
    */

    if (

        data.special &&

        Array.isArray(
            data.special.periods
        )

    ) {

        data.special.periods.forEach(
            period => {

                if (

                    isInPeriod(
                        period.start,
                        period.end
                    )

                ) {

                    if (
                        Array.isArray(
                            period.talk
                        )
                    ) {

                        talks.push(
                            ...period.talk
                        );

                    }

                }

            }
        );

    }


    /*
       月
    */

    if (

        data.special &&

        data.special.months

    ) {

        const monthTalk =
            data.special.months[
                String(
                    today.month
                )
            ];


        if (
            Array.isArray(
                monthTalk
            )
        ) {

            talks.push(
                ...monthTalk
            );

        }

    }


    return talks;

}



/* ==================================================
   通常台詞
================================================== */

function getNormalTalk() {

    const pool = [];


    if (

        data.talk &&

        Array.isArray(
            data.talk.normal
        )

    ) {

        pool.push(
            ...data.talk.normal
        );

    }


    pool.push(
        ...getSpecialTalks()
    );


    if (
        pool.length === 0
    ) {

        return null;

    }


    const key =
        "normal";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        pool[
            count[key] %
            pool.length
        ];


    count[key]++;


    return talk;

}



/* ==================================================
   連打
================================================== */

function getRapidTalk() {

    if (

        !data.talk ||

        !Array.isArray(
            data.talk.rapid
        ) ||

        data.talk.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        data.talk.rapid[
            count[key] %
            data.talk.rapid.length
        ];


    count[key]++;


    return talk;

}



/* ==================================================
   エリア
================================================== */

function inside(x, y, area) {

    return (

        x >= area.x &&

        x <=
            area.x +
            area.width &&

        y >= area.y &&

        y <=
            area.y +
            area.height

    );

}



function getArea(x, y) {

    if (

        !data ||

        !Array.isArray(
            data.areas
        )

    ) {

        return null;

    }


    for (

        let i =
            data.areas.length - 1;

        i >= 0;

        i--

    ) {

        const area =
            data.areas[i];


        if (
            inside(
                x,
                y,
                area
            )
        ) {

            return area;

        }

    }


    return null;

}



/* ==================================================
   エリア通常
================================================== */

function getAreaTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.talk
        ) ||

        area.talk.length === 0

    ) {

        return null;

    }


    const key =
        "area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        area.talk[
            count[key] %
            area.talk.length
        ];


    count[key]++;


    return talk;

}



/* ==================================================
   エリア連打
================================================== */

function getAreaRapidTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.rapid
        ) ||

        area.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid_area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const talk =
        area.rapid[
            count[key] %
            area.rapid.length
        ];


    count[key]++;


    return talk;

}



/* ==================================================
   ゲームクリック
================================================== */

game.addEventListener(
    "click",
    function(e) {

        if (!data) {

            return;

        }


        /*
           メニューなどをクリックした場合
        */

        if (
            e.target !== game
        ) {

            return;

        }


        const rect =
            game.getBoundingClientRect();


        const x =
            e.clientX -
            rect.left;


        const y =
            e.clientY -
            rect.top;


        const now =
            Date.now();


        const rapid =
            now - lastClick <
            RAPID_TIME;


        lastClick =
            now;


        /*
           エリア
        */

        const area =
            getArea(
                x,
                y
            );


        if (area) {

            if (rapid) {

                const rapidTalk =
                    getAreaRapidTalk(
                        area
                    );


                if (rapidTalk) {

                    speak(
                        rapidTalk,
                        x,
                        y
                    );

                    return;

                }

            }


            const areaTalk =
                getAreaTalk(
                    area
                );


            if (areaTalk) {

                speak(
                    areaTalk,
                    x,
                    y
                );

                return;

            }

        }


        /*
           キャラ連打
        */

        if (rapid) {

            const rapidTalk =
                getRapidTalk();


            if (rapidTalk) {

                speak(
                    rapidTalk,
                    x,
                    y
                );

                return;

            }

        }


        /*
           通常
        */

        const normalTalk =
            getNormalTalk();


        if (normalTalk) {

            speak(
                normalTalk,
                x,
                y
            );

        }

    }
);



/* ==================================================
   背景
================================================== */

const backgrounds = [

    {
        id: "none",
        name: "なし",
        image: ""
    },

    {
        id: "spring",
        name: "春",
        image: "spring.jpg",
        season: "spring"
    },

    {
        id: "summer",
        name: "夏",
        image: "summer.jpg",
        season: "summer"
    },

    {
        id: "autumn",
        name: "秋",
        image: "autumn.jpg",
        season: "autumn"
    },

    {
        id: "winter",
        name: "冬",
        image: "winter.jpg",
        season: "winter"
    }

];



/* ==================================================
   季節
================================================== */

function getSeason() {

    const month =
        new Date().getMonth() + 1;


    if (
        month >= 3 &&
        month <= 5
    ) {

        return "spring";

    }


    if (
        month >= 6 &&
        month <= 8
    ) {

        return "summer";

    }


    if (
        month >= 9 &&
        month <= 11
    ) {

        return "autumn";

    }


    return "winter";

}



/* ==================================================
   背景設定
================================================== */

function setBackground(bg) {

    currentBackground =
        bg;


    if (!bg.image) {

        background.removeAttribute(
            "src"
        );

        background.style.display =
            "none";

        return;

    }


    background.src =
        "backgrounds/" +
        bg.image;

    background.style.display =
        "block";

}



/* ==================================================
   起動時背景
================================================== */

function setupBackground() {

    const season =
        getSeason();


    const seasonal =
        backgrounds.find(
            bg =>
                bg.season ===
                season
        );


    setBackground(
        seasonal ||
        backgrounds[0]
    );

}



/* ==================================================
   背景一覧
================================================== */

function setupBackgroundMenu() {

    backgroundList.innerHTML =
        "";


    backgrounds.forEach(
        bg => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            if (bg.image) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    "backgrounds/" +
                    bg.image;


                card.appendChild(
                    img
                );

            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "card-name";


            name.innerText =
                bg.name;


            card.appendChild(
                name
            );


            card.onclick =
                () => {

                    setBackground(
                        bg
                    );

                };


            backgroundList.appendChild(
                card
            );

        }
    );

}



/* ==================================================
   キャラクター一覧
================================================== */

function setupCharacterMenu() {

    characterList.innerHTML =
        "";


    characters.forEach(
        char => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const img =
                document.createElement(
                    "img"
                );


            /*
               メニュー用顔画像
            */

            img.src =
                "images/" +
                char.image;


            img.style.objectFit =
                "cover";


            if (
                char.menu &&
                char.menu.face
            ) {

                const face =
                    char.menu.face;


                /*
                   CSSでは元画像の切り抜きを
                   background-position で行う
                */

                img.style.objectFit =
                    "none";

                img.style.objectPosition =
                    "center";


                /*
                   現段階では画像全体を
                   アイコンとして表示。
                   face指定は今後の切り抜き処理に利用可能。
                */

            }


            card.appendChild(
                img
            );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "card-name";


            name.innerText =
                char.name;


            card.appendChild(
                name
            );


            card.onclick =
                async () => {

                    await loadCharacter(
                        char
                    );

                };


            characterList.appendChild(
                card
            );

        }
    );

}



/* ==================================================
   誕生日一覧
================================================== */

function setupBirthdayMenu() {

    const birthdayCharacters =
        getBirthdayCharacters();


    birthdayList.innerHTML =
        "";


    if (
        birthdayCharacters.length === 0
    ) {

        birthdayList.innerHTML =
            '<div class="birthday-empty">' +
            '今日は誕生日のキャラクターはいません。' +
            '</div>';

        birthdayIcon.style.display =
            "none";

        return;

    }


    /*
       誕生日アイコンを表示
    */

    birthdayIcon.style.display =
        "block";


    birthdayCharacters.forEach(
        char => {

            const card =
                createCharacterCard(
                    char
                );


            birthdayList.appendChild(
                card
            );

        }
    );

}



/* ==================================================
   キャラクターカード
================================================== */

function createCharacterCard(char) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const img =
        document.createElement(
            "img"
        );


    img.src =
        "images/" +
        char.image;


    card.appendChild(
        img
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "card-name";


    name.innerText =
        char.name;


    card.appendChild(
        name
    );


    card.onclick =
        async () => {

            await loadCharacter(
                char
            );

        };


    return card;

}



/* ==================================================
   複数誕生日
================================================== */

function showBirthdayChoice(
    birthdayCharacters
) {

    menu.style.display =
        "block";


    characterSection.classList.add(
        "hidden"
    );


    backgroundSection.classList.add(
        "hidden"
    );


    birthdayList.innerHTML =
        "";


    birthdayCharacters.forEach(
        char => {

            birthdayList.appendChild(
                createCharacterCard(
                    char
                )
            );

        }
    );

}



/* ==================================================
   メニュー
================================================== */

function openMenu() {

    menu.style.display =
        "block";


    birthdayArea.style.display =
        "block";

}


function closeMenu() {

    menu.style.display =
        "none";

}



/* ==================================================
   メニュー操作
================================================== */

document
    .getElementById(
        "openMenu"
    )
    .onclick = () => {

        openMenu();

    };


document
    .getElementById(
        "closeMenu"
    )
    .onclick = () => {

        closeMenu();

    };


document
    .getElementById(
        "characterMenuButton"
    )
    .onclick = () => {

        characterSection.classList.remove(
            "hidden"
        );

        backgroundSection.classList.add(
            "hidden"
        );

        setupCharacterMenu();

    };


document
    .getElementById(
        "backgroundMenuButton"
    )
    .onclick = () => {

        characterSection.classList.add(
            "hidden"
        );

        backgroundSection.classList.remove(
            "hidden"
        );

        setupBackgroundMenu();

    };


birthdayIcon.onclick =
    () => {

        openMenu();

        characterSection.classList.add(
            "hidden"
        );

        backgroundSection.classList.add(
            "hidden"
        );

    };



/* ==================================================
   起動
================================================== */

init();

</script>
