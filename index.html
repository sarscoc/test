<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: sans-serif;

}


/* =========================
   ゲーム画面
========================= */

#game {

    width: 900px;

    height: 506px;

    position: relative;

    overflow: hidden;

    background: white;

    border: 2px solid #999;

    cursor: pointer;

}


/* =========================
   キャラクター
========================= */

#character {

    position: absolute;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;

}


/* =========================
   台詞
========================= */

#message {

    position: absolute;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: white;

    border-radius: 24px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    z-index: 1000;

}


@keyframes pop {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


#status {

    display: none;

}

</style>

</head>


<body>


<div id="game">

    <img id="character">

    <div id="message"></div>

    <div id="status"></div>

</div>


<script>


/* ==================================================
   基本
================================================== */

const game =
    document.getElementById("game");

const character =
    document.getElementById("character");

const message =
    document.getElementById("message");


let data = null;


/*
   現在の衣装
*/

let currentCostume = null;


/*
   台詞カウンター
*/

const count = {};


/*
   連打判定
*/

let lastClick = 0;

const RAPID_TIME = 400;


/*
   台詞表示タイマー
*/

let messageTimer = null;



/* ==================================================
   JSON読み込み
================================================== */

fetch("characters/143.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "143.json を読み込めませんでした。"
        );

    }

    return response.json();

})

.then(json => {

    data = json;

    setupCharacter();

    showGreeting();

})

.catch(error => {

    console.error(error);

});



/* ==================================================
   キャラクター初期設定
================================================== */

function setupCharacter() {

    /*
       costumes がある場合は
       最初の衣装を使用
    */

    if (
        Array.isArray(data.costumes) &&
        data.costumes.length > 0
    ) {

        currentCostume =
            data.costumes[0];

    }

    else {

        currentCostume = {

            id: "default",

            name: "通常",

            image: data.image,

            position:
                data.position || {},

            expressions: {}

        };

    }


    loadCostume();

}



/* ==================================================
   衣装読み込み
================================================== */

function loadCostume() {

    const position =
        currentCostume.position ||
        data.position ||
        {};


    character.src =
        "images/" +
        currentCostume.image;


    character.style.left =
        (position.x || 0) +
        "px";


    character.style.top =
        (position.y || 0) +
        "px";


    character.style.width =
        (position.scale || 250) +
        "px";

}



/* ==================================================
   表情変更
================================================== */

function setExpression(expression) {

    const expressions =
        currentCostume.expressions ||
        {};


    /*
       表情指定なし
       → 通常画像に戻す
    */

    if (!expression) {

        character.src =
            "images/" +
            currentCostume.image;

        return;

    }


    /*
       指定された表情が存在する
    */

    if (
        expressions[expression]
    ) {

        character.src =
            "images/" +
            expressions[expression];

        return;

    }


    /*
       指定された表情が存在しない
       → 通常画像
    */

    character.src =
        "images/" +
        currentCostume.image;

}



/* ==================================================
   台詞表示
================================================== */

function showTalk(text, x, y) {

    if (!text) {

        return;

    }


    message.innerText =
        text;


    let messageX =
        x + 15;


    let messageY =
        y - 20;


    /*
       右端からはみ出さない
    */

    if (
        messageX + 420 >
        game.clientWidth
    ) {

        messageX =
            game.clientWidth - 440;

    }


    /*
       左端からはみ出さない
    */

    if (
        messageX < 10
    ) {

        messageX = 10;

    }


    /*
       上端からはみ出さない
    */

    if (
        messageY < 20
    ) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    /*
       アニメーションをリセット
    */

    message.style.animation =
        "none";


    void message.offsetWidth;


    message.style.animation =
        "pop 0.2s ease-out";


    /*
       前のタイマーを解除
    */

    if (messageTimer) {

        clearTimeout(messageTimer);

    }


    /*
       一定時間で消す
    */

    messageTimer =
        setTimeout(() => {

            message.style.display =
                "none";

        }, 2500);

}



/* ==================================================
   台詞を表示する
================================================== */

function speak(talk, x, y) {

    if (!talk) {

        return;

    }


    /*
       台詞に表情指定があれば変更。
       指定がなければ通常顔へ戻す。
    */

    setExpression(
        talk.expression
    );


    showTalk(
        talk.text,
        x,
        y
    );

}



/* ==================================================
   挨拶
================================================== */

function showGreeting() {

    if (
        !data.talk ||

        !Array.isArray(
            data.talk.greeting
        ) ||

        data.talk.greeting.length === 0
    ) {

        return;

    }


    speak(

        data.talk.greeting[0],

        game.clientWidth / 2,

        100

    );

}



/* ==================================================
   今日の日付
================================================== */

function getToday() {

    const now =
        new Date();


    return {

        month:
            now.getMonth() + 1,

        day:
            now.getDate()

    };

}



/* ==================================================
   MM-DD → 数値
================================================== */

function dateNumber(value) {

    const parts =
        value.split("-");


    return (

        Number(parts[0]) * 100 +

        Number(parts[1])

    );

}



/* ==================================================
   期間判定
   年またぎ対応
================================================== */

function isInPeriod(start, end) {

    const today =
        getToday();


    const current =
        today.month * 100 +
        today.day;


    const startNumber =
        dateNumber(start);


    const endNumber =
        dateNumber(end);


    /*
       普通の期間
    */

    if (
        startNumber <= endNumber
    ) {

        return (

            current >= startNumber &&

            current <= endNumber

        );

    }


    /*
       年またぎ
    */

    return (

        current >= startNumber ||

        current <= endNumber

    );

}



/* ==================================================
   特別台詞を全部取得
================================================== */

function getSpecialTalks() {

    const talks = [];


    const today =
        getToday();



    /* ==========================================
       誕生日
    ========================================== */

    if (

        data.birthday &&

        data.birthday.month ===
            today.month &&

        data.birthday.day ===
            today.day &&

        Array.isArray(
            data.birthday.talk
        )

    ) {

        talks.push(
            ...data.birthday.talk
        );

    }



    /* ==========================================
       特定日
    ========================================== */

    if (

        data.special &&

        Array.isArray(
            data.special.dates
        )

    ) {

        data.special.dates.forEach(
            item => {

                if (

                    item.month ===
                        today.month &&

                    item.day ===
                        today.day &&

                    Array.isArray(
                        item.talk
                    )

                ) {

                    talks.push(
                        ...item.talk
                    );

                }

            }
        );

    }



    /* ==========================================
       期間
    ========================================== */

    if (

        data.special &&

        Array.isArray(
            data.special.periods
        )

    ) {

        data.special.periods.forEach(
            period => {

                if (

                    isInPeriod(
                        period.start,
                        period.end
                    )

                ) {

                    if (

                        Array.isArray(
                            period.talk
                        )

                    ) {

                        talks.push(
                            ...period.talk
                        );

                    }

                }

            }
        );

    }



    /* ==========================================
       月
    ========================================== */

    if (

        data.special &&

        data.special.months

    ) {

        const monthTalk =

            data.special.months[
                String(
                    today.month
                )
            ];


        if (

            Array.isArray(
                monthTalk
            )

        ) {

            talks.push(
                ...monthTalk
            );

        }

    }


    return talks;

}



/* ==================================================
   通常＋特別台詞
================================================== */

function getNormalPool() {

    const pool = [];


    /*
       通常台詞
    */

    if (

        data.talk &&

        Array.isArray(
            data.talk.normal
        )

    ) {

        pool.push(
            ...data.talk.normal
        );

    }


    /*
       特別台詞
    */

    pool.push(
        ...getSpecialTalks()
    );


    return pool;

}



/* ==================================================
   通常台詞取得
================================================== */

function getNormalTalk() {

    const pool =
        getNormalPool();


    if (
        pool.length === 0
    ) {

        return null;

    }


    const key =
        "normal_pool";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        pool[
            index %
            pool.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   キャラ連打台詞
================================================== */

function getRapidTalk() {

    if (

        !data.talk ||

        !Array.isArray(
            data.talk.rapid
        ) ||

        data.talk.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        data.talk.rapid[
            index %
            data.talk.rapid.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   エリア判定
================================================== */

function inside(x, y, area) {

    return (

        x >= area.x &&

        x <=
            area.x +
            area.width &&

        y >= area.y &&

        y <=
            area.y +
            area.height

    );

}



/* ==================================================
   エリア取得
================================================== */

function getArea(x, y) {

    if (

        !data ||

        !Array.isArray(
            data.areas
        )

    ) {

        return null;

    }


    /*
       後ろから確認することで、
       重なったエリアでは後に書いたものを優先
    */

    for (

        let i =
            data.areas.length - 1;

        i >= 0;

        i--

    ) {

        const area =
            data.areas[i];


        if (

            inside(
                x,
                y,
                area
            )

        ) {

            return area;

        }

    }


    return null;

}



/* ==================================================
   エリア通常台詞
================================================== */

function getAreaTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.talk
        ) ||

        area.talk.length === 0

    ) {

        return null;

    }


    const key =
        "area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.talk[
            index %
            area.talk.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   エリア連打台詞
================================================== */

function getAreaRapidTalk(area) {

    if (

        !area ||

        !Array.isArray(
            area.rapid
        ) ||

        area.rapid.length === 0

    ) {

        return null;

    }


    const key =
        "rapid_area_" +
        area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    const index =
        count[key];


    const talk =
        area.rapid[
            index %
            area.rapid.length
        ];


    count[key] =
        index + 1;


    return talk;

}



/* ==================================================
   クリック
================================================== */

game.addEventListener(

    "click",

    function(e) {


        if (!data) {

            return;

        }


        const rect =
            game.getBoundingClientRect();


        const x =
            e.clientX -
            rect.left;


        const y =
            e.clientY -
            rect.top;


        const now =
            Date.now();


        const rapid =
            now - lastClick <
            RAPID_TIME;


        lastClick =
            now;



        /* ==========================================
           エリア
        ========================================== */

        const area =
            getArea(
                x,
                y
            );


        if (area) {


            /*
               エリア連打
            */

            if (rapid) {

                const rapidTalk =
                    getAreaRapidTalk(
                        area
                    );


                if (rapidTalk) {

                    speak(

                        rapidTalk,

                        x,

                        y

                    );

                    return;

                }

            }


            /*
               エリア通常
            */

            const areaTalk =
                getAreaTalk(
                    area
                );


            if (areaTalk) {

                speak(

                    areaTalk,

                    x,

                    y

                );

                return;

            }

        }



        /* ==========================================
           キャラ連打
        ========================================== */

        if (rapid) {

            const rapidTalk =
                getRapidTalk();


            if (rapidTalk) {

                speak(

                    rapidTalk,

                    x,

                    y

                );

                return;

            }

        }



        /* ==========================================
           通常＋特別
        ========================================== */

        const normalTalk =
            getNormalTalk();


        if (normalTalk) {

            speak(

                normalTalk,

                x,

                y

            );

        }

    }

);


</script>

</body>

</html>
