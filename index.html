<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラクター＆衣装ビューア</title>
  <style>
    /* ==========================================
       全体スタイル・レイアウト設定
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #f0f2f5;
      color: #333;
    }

    /* ==========================================
       左側：操作サイドバー
       ========================================== */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: #ffffff;
      padding: 24px 20px;
      border-right: 1px solid #e1e4e8;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 1.2rem;
      color: #1a1a1a;
      border-bottom: 2px solid #4a90e2;
      padding-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #4a5568;
    }

    .input-group input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input[type="text"]:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    /* URL直下に配置する衣装選択ボタン群 */
    .costume-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .costume-btn {
      flex: 1 1 calc(50% - 4px);
      padding: 9px 12px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e0;
      color: #4a5568;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.2s ease;
    }

    .costume-btn:hover {
      background-color: #edf2f7;
      border-color: #a0aec0;
    }

    .costume-btn.active {
      background-color: #4a90e2;
      border-color: #4a90e2;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(74, 144, 226, 0.3);
    }

    .status-panel {
      margin-top: auto;
      padding: 12px;
      background-color: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .status-panel .status-title {
      font-weight: bold;
      color: #718096;
      margin-bottom: 4px;
    }

    .status-panel .status-value {
      color: #2d3748;
      font-weight: 600;
    }

    /* ==========================================
       右側：メインキャンバス / ステージ
       ========================================== */
    .stage {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #e2e8f0;
      background-image: 
        radial-gradient(#cbd5e0 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer; /* 空白クリック操作が可能なことを示すポインター */
      user-select: none;
      overflow: hidden;
    }

    /* キャラクター表示コンテナ */
    .character-container {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto; /* コンテナ内へのクリック判定を保持 */
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .character-image {
      max-height: 80vh;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
      border-radius: 8px;
    }

    /* 非表示状態（トップに戻った時）のスタイル */
    .character-container.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* 画面背景への案内テキスト */
    .bg-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 0.8rem;
      color: #a0aec0;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- 左側：操作サイドバー -->
  <div class="sidebar">
    <h2>設定パネル</h2>
    
    <!-- 1. URL入力エリア ＆ 直下の衣装選択ボタン -->
    <div class="input-group">
      <label for="img-url">画像 / 立ち絵 URL</label>
      <input type="text" id="img-url" placeholder="https://example.com/image.png" value="https://via.placeholder.com/400x600/4a90e2/ffffff?text=Default+Costume">
      
      <!-- ★ ご要望1：URLの直下に配置した衣装選択ボタン群 -->
      <div class="costume-buttons" id="costume-selector">
        <button class="costume-btn active" data-costume="default" data-img="https://via.placeholder.com/400x600/4a90e2/ffffff?text=Default+Costume">通常衣装</button>
        <button class="costume-btn" data-costume="costume-a" data-img="https://via.placeholder.com/400x600/50e3c2/ffffff?text=Costume+A">衣装 A</button>
        <button class="costume-btn" data-costume="costume-b" data-img="https://via.placeholder.com/400x600/f5a623/ffffff?text=Costume+B">衣装 B</button>
        <button class="costume-btn" data-costume="costume-c" data-img="https://via.placeholder.com/400x600/e91e63/ffffff?text=Costume+C">衣装 C</button>
      </div>
    </div>

    <!-- ステータス表示パネル -->
    <div class="status-panel">
      <div class="status-title">現在の状態</div>
      <div class="status-value" id="status-display">キャラ選択中（通常衣装）</div>
    </div>
  </div>

  <!-- 右側：表示エリア（この空きスペースをクリックするとトップに戻る） -->
  <div class="stage" id="stage">
    <!-- キャラクター表示枠 -->
    <div class="character-container" id="character-container">
      <img id="char-img" class="character-image" src="https://via.placeholder.com/400x600/4a90e2/ffffff?text=Default+Costume" alt="キャラクター画像">
    </div>

    <div class="bg-hint">※ 何もない場所をクリックすると未選択状態に戻ります</div>
  </div>

  <!-- JavaScript 処理 -->
  <script>
    // 要素の取得
    const stage = document.getElementById('stage');
    const characterContainer = document.getElementById('character-container');
    const charImg = document.getElementById('char-img');
    const imgUrlInput = document.getElementById('img-url');
    const costumeSelector = document.getElementById('costume-selector');
    const statusDisplay = document.getElementById('status-display');
    const costumeButtons = document.querySelectorAll('.costume-btn');

    // 1. URL直接入力時の画像反映処理
    imgUrlInput.addEventListener('input', (e) => {
      const url = e.target.value.trim();
      if (url) {
        charImg.src = url;
        characterContainer.classList.remove('hidden');
        statusDisplay.textContent = 'カスタムURL画像表示中';
      }
    });

    // 2. 衣装選択ボタンの挙動（URL直下のボタン押下時）
    costumeSelector.addEventListener('click', (e) => {
      const btn = e.target.closest('.costume-btn');
      if (!btn) return;

      // ボタンのアクティブ状態の切り替え
      costumeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // データの反映
      const newImgUrl = btn.dataset.img;
      imgUrlInput.value = newImgUrl;
      charImg.src = newImgUrl;

      // キャラクターを表示状態にし、ステータスを更新
      characterContainer.classList.remove('hidden');
      statusDisplay.textContent = `選択中: ${btn.textContent}`;
    });

    // 3. キャラクター自体のクリック時に背景クリックイベントへ伝播（バブリング）させない
    characterContainer.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // ★ ご要望2：何もない画面（背景）をクリックした時にトップ（未選択状態）へ戻る
    stage.addEventListener('click', () => {
      resetToTop();
    });

    // リセット（トップへ戻る）処理の関数
    function resetToTop() {
      // キャラクターを非表示（CSSアニメーション付き）
      characterContainer.classList.add('hidden');
      
      // ボタンの選択状態を解除
      costumeButtons.forEach(b => b.classList.remove('active'));
      
      // ステータス表示の更新
      statusDisplay.textContent = '未選択（トップ状態）';
      
      console.log('トップ画面（未選択状態）に戻りました');
    }
  </script>
</body>
</html>
