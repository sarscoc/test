<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: sans-serif;
}


/* =========================
   ゲーム画面
========================= */

#game {

    width: 900px;
    height: 506px;

    position: relative;

    overflow: hidden;

    background: white;

    border: 2px solid #ccc;

    cursor: pointer;
}


/* =========================
   キャラクター
========================= */

#character {

    position: absolute;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;
}


/* =========================
   台詞
========================= */

#message {

    position: absolute;

    display: none;

    max-width: 420px;

    padding: 14px 22px;

    background: white;

    border-radius: 24px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.15);

    font-size: 20px;

    line-height: 1.5;

    pointer-events: none;

    z-index: 1000;

    animation: pop 0.2s ease-out;
}


@keyframes pop {

    from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================
   エリア表示
========================= */

.debug-area {

    position: absolute;

    border: 2px dashed rgba(255, 0, 0, 0.8);

    background: rgba(255, 0, 0, 0.12);

    pointer-events: none;

    z-index: 500;
}


.debug-area-name {

    position: absolute;

    top: -24px;
    left: -2px;

    padding: 2px 7px;

    background: rgba(255, 0, 0, 0.8);

    color: white;

    font-size: 13px;

    white-space: nowrap;

    border-radius: 4px;
}


/* =========================
   読み込み表示
========================= */

#status {

    position: absolute;

    left: 10px;
    bottom: 10px;

    padding: 5px 10px;

    background: rgba(0,0,0,0.7);

    color: white;

    font-size: 12px;

    border-radius: 5px;

    z-index: 2000;
}

</style>

</head>


<body>


<div id="game">

    <img id="character">

    <div id="message"></div>

    <div id="status">
        読み込み中……
    </div>

</div>


<script>


/* =========================
   基本設定
========================= */

const game =
    document.getElementById("game");

const character =
    document.getElementById("character");

const message =
    document.getElementById("message");

const status =
    document.getElementById("status");


let data = null;


/* 台詞の現在位置 */

const count = {};


/* 最後のクリック時刻 */

let lastClick = 0;


/* 台詞表示タイマー */

let messageTimer = null;



/* =========================
   キャラクターデータ読み込み
========================= */

fetch("characters/143.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "143.json を読み込めませんでした。"
        );

    }

    return response.json();

})

.then(json => {

    data = json;

    status.innerText =
        data.name + " 読み込み完了";


    loadCharacter();

    drawAreas();

    showGreeting();

})


.catch(error => {

    console.error(error);

    status.innerText =
        "読み込みエラー: " + error.message;

});



/* =========================
   キャラクター表示
========================= */

function loadCharacter() {


    const position =
        data.position;


    character.src =
        "images/" + data.image;


    character.style.left =
        position.x + "px";


    character.style.top =
        position.y + "px";


    character.style.width =
        position.scale + "px";


    character.onerror = function() {

        status.innerText =
            "画像を読み込めません: " +
            data.image;

    };

}



/* =========================
   エリア表示
========================= */

function drawAreas() {


    /* 古いエリアを削除 */

    document
        .querySelectorAll(".debug-area")
        .forEach(element => {
            element.remove();
        });


    if (!data.areas) {
        return;
    }


    data.areas.forEach((area, index) => {


        const box =
            document.createElement("div");


        box.className =
            "debug-area";


        box.style.left =
            area.x + "px";


        box.style.top =
            area.y + "px";


        box.style.width =
            area.width + "px";


        box.style.height =
            area.height + "px";


        const name =
            document.createElement("div");


        name.className =
            "debug-area-name";


        name.innerText =
            area.name ||
            "エリア" + (index + 1);


        box.appendChild(name);


        game.appendChild(box);

    });

}



/* =========================
   起動時台詞
========================= */

function showGreeting() {


    if (
        data.talk &&
        data.talk.greeting &&
        data.talk.greeting.length > 0
    ) {

        const talk =
            data.talk.greeting[0];


        showTalk(
            talk.text,
            450,
            100
        );

    }

}



/* =========================
   台詞表示
========================= */

function showTalk(text, x, y) {


    message.innerText =
        text;


    /*
       画面外に出ないように
       少し補正
    */

    let messageX =
        x + 15;

    let messageY =
        y - 20;


    if (messageX > 650) {

        messageX = 450;

    }


    if (messageY < 20) {

        messageY = 20;

    }


    message.style.left =
        messageX + "px";


    message.style.top =
        messageY + "px";


    message.style.display =
        "block";


    /*
       アニメーションを再実行
    */

    message.style.animation =
        "none";

    void message.offsetWidth;

    message.style.animation =
        "pop 0.2s ease-out";


    /*
       前のタイマーを消す
    */

    if (messageTimer) {

        clearTimeout(messageTimer);

    }


    messageTimer =
        setTimeout(() => {

            message.style.display =
                "none";

        }, 2500);

}



/* =========================
   エリア内判定
========================= */

function inside(x, y, area) {


    return (

        x >= area.x &&

        x <= area.x + area.width &&

        y >= area.y &&

        y <= area.y + area.height

    );

}



/* =========================
   押されたエリアを取得
========================= */

function getArea(x, y) {


    if (!data || !data.areas) {

        return null;

    }


    /*
       複数重なった場合、
       後から登録したエリアを優先
    */

    for (
        let i = data.areas.length - 1;
        i >= 0;
        i--
    ) {

        const area =
            data.areas[i];


        if (
            inside(x, y, area)
        ) {

            return area;

        }

    }


    return null;

}



/* =========================
   エリアごとの台詞取得
========================= */

function getAreaTalk(area) {


    if (
        !area ||
        !area.talk ||
        area.talk.length === 0
    ) {

        return null;

    }


    const key =
        "area_" + area.name;


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    let index =
        count[key];


    if (
        index >= area.talk.length
    ) {

        index =
            area.talk.length - 1;

    }
    else {

        count[key]++;

    }


    return area.talk[index];

}



/* =========================
   通常台詞取得
========================= */

function getNormalTalk() {


    if (
        !data.talk ||
        !data.talk.normal ||
        data.talk.normal.length === 0
    ) {

        return null;

    }


    const key =
        "normal";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    let index =
        count[key];


    if (
        index >= data.talk.normal.length
    ) {

        index =
            data.talk.normal.length - 1;

    }
    else {

        count[key]++;

    }


    return data.talk.normal[index];

}



/* =========================
   連打台詞取得
========================= */

function getRapidTalk() {


    if (
        !data.talk ||
        !data.talk.rapid ||
        data.talk.rapid.length === 0
    ) {

        return null;

    }


    const key =
        "rapid";


    if (
        count[key] === undefined
    ) {

        count[key] = 0;

    }


    let index =
        count[key];


    if (
        index >= data.talk.rapid.length
    ) {

        index =
            data.talk.rapid.length - 1;

    }
    else {

        count[key]++;

    }


    return data.talk.rapid[index];

}



/* =========================
   クリック
========================= */

game.addEventListener(
    "click",
    function(e) {


        /*
           JSONがまだ読めていない場合
        */

        if (!data) {

            return;

        }


        const rect =
            game.getBoundingClientRect();


        const x =
            e.clientX - rect.left;


        const y =
            e.clientY - rect.top;


        const now =
            Date.now();


        const rapid =
            now - lastClick < 400;


        lastClick =
            now;



        /*
           まずエリアを判定
           
           エリアは「いかなる時も」
           専用台詞を優先
        */

        const area =
            getArea(x, y);


        if (area) {


            const talk =
                getAreaTalk(area);


            if (talk) {

                showTalk(
                    talk.text,
                    x,
                    y
                );

                return;

            }

        }



        /*
           エリア外なら連打判定
        */

        if (rapid) {


            const talk =
                getRapidTalk();


            if (talk) {

                showTalk(
                    talk.text,
                    x,
                    y
                );

                return;

            }

        }



        /*
           それ以外は通常台詞
        */

        const talk =
            getNormalTalk();


        if (talk) {

            showTalk(
                talk.text,
                x,
                y
            );

        }


    }
);


</script>

</body>

</html>
